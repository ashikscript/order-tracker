<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="wrap">

  <!-- SETUP SCREEN (hidden - URL hardcoded) -->
  <div id="setupScreen" style="display:none"></div>

  <!-- MAIN APP -->
  <div id="mainApp">

    <!-- Top bar -->
    <div class="topbar">
      <div class="app-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 10h18"/>
        </svg>
        Order Tracker
      </div>
      <div class="top-right">
        <div class="sync-badge" id="syncStatus"></div>
        <!-- Trash Button -->
        <button class="btn-trash" onclick="openTrash()" title="Trash">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span id="trashBadge" class="trash-badge"></span>
        </button>
        <span class="badge badge-locked" id="authBadge" onclick="handleBadgeClick()">🔒 Locked</span>
      </div>
    </div>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Total Orders</div>
        <div class="metric-value" id="totalOrders">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total Profit</div>
        <div class="metric-value green" id="totalProfit">—</div>
      </div>
    </div>

    <!-- New Entry / Edit (Admin only) -->
    <div class="card" id="addCard" style="display:none">
      <div class="card-title" id="formTitle">New Entry</div>
      <div class="row2">
        <div>
          <label class="field-label">My Site Order ID</label>
          <input type="text" id="myId" placeholder="e.g. ORD-1001"/>
        </div>
        <div>
          <label class="field-label">Other Site Order ID</label>
          <input type="text" id="otherId" placeholder="e.g. EXT-5523"/>
        </div>
      </div>
      <div class="row2">
        <div>
          <label class="field-label">Profit (৳)</label>
          <input type="number" id="profit" placeholder="0"/>
        </div>
        <div>
          <label class="field-label">Note (optional)</label>
          <input type="text" id="note" placeholder="..."/>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn-save" id="saveBtn" onclick="saveOrder()">+ Save Order</button>
        <button class="btn-cancel" id="cancelEdit" style="display:none" onclick="clearForm()">✕ Cancel</button>
      </div>
      <div class="err" id="addErr"></div>
      <div class="ok-msg" id="addOk"></div>
    </div>

    <!-- Lock screen -->
    <div class="card" id="lockCard">
      <div class="lock-center">
        <div class="lock-icon">🔐</div>
        <div class="lock-h">Admin Login</div>
        <div class="lock-sub">Enter password to add or delete orders</div>
        <div class="lock-form">
          <input type="password" id="passInput" placeholder="Password..." onkeydown="if(event.key==='Enter')tryLogin()"/>
          <button class="btn-login" onclick="tryLogin()">Login</button>
          <div class="err" id="passErr"></div>
        </div>
      </div>
    </div>

    <!-- Profit Summary -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
        <div class="card-title" style="margin-bottom:0">Profit Summary</div>
        <button class="btn-export" onclick="exportExcel()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export to Excel
        </button>
      </div>
      <div class="summary-controls">
        <select id="summaryType" onchange="renderSummary()">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
        <select id="summaryYear" onchange="onYearChange()"></select>
        <span id="monthSelWrap">
          <select id="summaryMonth" onchange="renderSummary()"></select>
        </span>
      </div>
      <div id="summaryContent"></div>
    </div>

    <!-- Search -->
    <div class="card">
      <div class="card-title">Search</div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchBox" placeholder="Search any order ID..." oninput="renderOrders()"/>
      </div>
    </div>

    <!-- Recent Orders -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <div class="card-title" style="margin-bottom:0">Recent 5 Orders</div>
        <span class="order-count" id="orderCount"></span>
      </div>
      <div id="orderList"><div class="empty">Loading...</div></div>
    </div>

  </div><!-- /mainApp -->
</div><!-- /wrap -->

<!-- TRASH MODAL -->
<div id="trashModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Trash
      </div>
      <button class="modal-close" onclick="closeTrash()">✕</button>
    </div>
    <div class="modal-sub">Deleted orders are kept for 15 days, then removed automatically.</div>
    <div id="trashList"><div class="empty">Loading...</div></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
